<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="stylesheet" href="css/notes.css">
</head>
<body>

<div class="app">

  <header class="top">
    <div>
      <h1>Notes</h1>
      <p class="tagline">Simple and easy — jot it down before it slips away.</p>
    </div>
    <div class="account">
      <div class="who" id="whoLabel">Not signed in</div>
      <button id="authBtn" type="button">Sign in</button>
    </div>
  </header>

  <section class="search-row">
    <input
      type="text"
      id="searchNote"
      name="searchNote"
      placeholder="Search your notes by name"
      autocomplete="off"
    >
  </section>

  <section class="editor">
    <form id="noteForm">
      <label for="nameNote">Title</label>
      <input
        type="text"
        id="nameNote"
        name="nameNote"
        placeholder="Give it a name"
        autocomplete="off"
        required
      >

      <label for="note">Note</label>
      <textarea
        id="note"
        name="note"
        placeholder="Write it down"
        required
      ></textarea>

      <div class="editor-actions">
        <span class="hint" id="editHint"></span>
        <button type="submit" class="primary" id="saveBtn">Save note</button>
      </div>
    </form>
  </section>

  <div class="notesList" id="notesList"></div>

  <p class="storage-note">
    Notes are saved to this browser only, under your current account name.
    Sign in is a placeholder for now — no data leaves your device yet.
  </p>

</div>

<script src="js/analytics.js"></script>
<script src="js/notes.js"></script>

</body>
</html>
